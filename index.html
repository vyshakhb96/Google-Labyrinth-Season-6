<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter the Labyrinth</title>
    <!-- Premium Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&family=Share+Tech+Mono&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <meta name="description" content="A hacker themed mystery Labyrinth">
</head>

<body>
    <!-- Background Layers -->
    <div class="bg-layer" id="bg-layer"></div>
    <div class="grid-overlay"></div>
    <!-- Canvas for Particles will be injected by script.js -->

    <!-- Main UI Container -->
    <div class="container">
        <!-- SVG Lock Icon -->
        <div class="lock-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>

        <h1 class="glitch-title">Enter the Labyrinth</h1>
        <p class="subtitle">System locked. Authentication required.</p>

        <div class="input-group">
            <input type="text" id="passkey" placeholder="Enter the secret name..." autocomplete="off"
                spellcheck="false">
            <button id="unlock-btn">
                <span class="btn-text">Unlock Clue</span>
            </button>
        </div>

        <!-- Error Message Placeholder -->
        <p id="error-msg" class="hidden">Authentication failed. The maze rejects you.</p>
    </div>

    <!-- Hidden Popup Modal for Clue -->
    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <!-- SVG Unlock / Success Icon -->
            <div class="success-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
            </div>

            <h2 class="access-granted">Access Granted</h2>

            <div class="clue-container">
                <p id="clue-text" class="clue-text"></p>
            </div>

            <button id="next-btn" class="next-btn">
                <span class="btn-text">Proceed to Next Phase</span>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
